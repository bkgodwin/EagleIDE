name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Python and browser scripts
        run: |
          python -m py_compile app.py sandbox_worker.py sandbox_policy.py sandbox_containment.py
          node --check static/js/app-core.js
          bash -n start.sh

      - name: Validate one-command LXC setup
        env:
          EAGLEIDE_SETUP_ONLY: "1"
          EAGLEIDE_SKIP_SYSTEM_PACKAGES: "1"
        run: ./start.sh

      - name: Run test suite
        run: python -m unittest discover -s tests -v
