name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Reject private runtime data and credentials
        run: python tools/check_private_data.py --history

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-bootstrap.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Validate Python and browser scripts
        run: |
          python -m py_compile app.py sandbox_worker.py sandbox_policy.py sandbox_containment.py external_tools.py tool_store.py tool_gateway.py tool_storage.py
          node --check static/js/app-core.js
          node --check static/js/html-runtime-popup.js
          node --check static/js/external-tools.js
          node --check static/js/external-tools-admin.js
          node --check static/js/external-tool-runtime.js
          bash -n start.sh

      - name: Validate one-command LXC setup
        env:
          EAGLEIDE_SETUP_ONLY: "1"
          EAGLEIDE_SKIP_SYSTEM_PACKAGES: "1"
        run: ./start.sh

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.js
